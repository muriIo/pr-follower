# PR Follower on one machine with Docker: Postgres, the API, the panel and Caddy (automatic HTTPS).
# Works on any Linux host or VM with Docker, on any provider. INSTALL.md walks through it.
#
#   cp .env.example .env            # fill it in (INSTALL.md §2-3)
#   install -d secrets && install -m 0400 -o 10001 -g 10001 <key>.pem secrets/github-app.pem
#   docker compose up -d
#
# Using a managed Postgres instead of the bundled one: set DATABASE_URL and remove
# COMPOSE_PROFILES in .env.
name: pr-follower

services:
  postgres:
    profiles: [bundled-db] # on through COMPOSE_PROFILES in .env
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prfollower
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: pr_follower
    volumes:
      - postgres_data:/var/lib/postgresql/data # back this volume up (INSTALL.md §6)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prfollower -d pr_follower"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published port: only the API reaches it, on the compose network.

  api:
    image: ${REGISTRY:-ghcr.io/muriio}/pr-follower-api:${PR_FOLLOWER_VERSION:?set PR_FOLLOWER_VERSION in .env}
    restart: unless-stopped # it exits if Postgres is unreachable at start; migrations run on start
    environment:
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      ALLOWED_ORIGIN: https://${DOMAIN}
      DATABASE_URL: ${DATABASE_URL:-postgres://prfollower:${POSTGRES_PASSWORD}@postgres:5432/pr_follower?sslmode=disable}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID in .env}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET in .env}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?set GITHUB_APP_ID in .env}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:?set GITHUB_APP_SLUG in .env}
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app.pem
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET in .env}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY in .env}
    volumes:
      - ./secrets/github-app.pem:/run/secrets/github-app.pem:ro # readable by UID 10001
    depends_on:
      postgres: { condition: service_healthy, required: false }
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging:
      options: { max-size: 10m, max-file: "5" }

  panel:
    image: ${REGISTRY:-ghcr.io/muriio}/pr-follower-panel:${PR_FOLLOWER_VERSION}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8080 # scheme, host and port only
    depends_on:
      api: { condition: service_healthy } # nginx resolves `api` once, when it starts
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      options: { max-size: 10m, max-file: "5" }

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep this volume
      - caddy_config:/config
    depends_on:
      panel: { condition: service_healthy }

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
