# The panel: nginx serving the SPA and proxying /api/* to the API, so browsers and GitHub talk to
# one origin (the session cookie depends on it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-follower-panel
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: pr-follower-panel }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pr-follower-panel }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: panel
          image: ghcr.io/muriio/pr-follower-panel
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: API_UPSTREAM, value: "http://pr-follower-api:8080" } # scheme, host and port only
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: pr-follower-panel
spec:
  selector: { app.kubernetes.io/name: pr-follower-panel }
  ports:
    - { name: http, port: 8080, targetPort: http }
