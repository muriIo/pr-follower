# The panel: nginx serving the SPA and proxying /api/* to the API, so browsers and GitHub talk to
# one origin (the session cookie depends on it). Its /healthz is answered by nginx itself; the API's
# health is /api/v1/healthz.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-follower-panel
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: pr-follower-panel }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pr-follower-panel }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: panel
          image: ghcr.io/muriio/pr-follower-panel
          ports:
            - { name: http, containerPort: 8080 }
          env:
            # Scheme, host and port only. A Kustomize namePrefix/nameSuffix renames the Service but
            # not this string: change it too.
            - { name: API_UPSTREAM, value: "http://pr-follower-api:8080" }
          volumeMounts:
            # The root filesystem is read-only. nginx keeps its pid and temp files in /tmp (large
            # webhook bodies are buffered there), and the entrypoint renders conf.d/default.conf
            # from the template at every start.
            - { name: tmp, mountPath: /tmp }
            - { name: conf, mountPath: /etc/nginx/conf.d }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: conf
          emptyDir: { sizeLimit: 1Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: pr-follower-panel
spec:
  selector: { app.kubernetes.io/name: pr-follower-panel }
  ports:
    - { name: http, port: 8080, targetPort: http }
