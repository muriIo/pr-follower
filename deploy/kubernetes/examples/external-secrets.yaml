# GitOps: the two Secrets of INSTALL.md path B, synced from a secret manager by the External
# Secrets Operator instead of `kubectl create secret`. Git holds only where each value lives.
# Add this file to kustomization.yaml's resources, and point secretStoreRef at your store (AWS
# Parameter Store or Secrets Manager, Vault, GCP, Azure… configured by your platform team).
#
# The operator refreshes each Secret every refreshInterval, but the API reads its environment and
# key file once, at start: after rotating a value, `kubectl rollout restart deploy/pr-follower-api`
# (or let a tool such as Stakater Reloader do it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pr-follower
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: change-me } # your store
  target:
    name: pr-follower # read by api.yaml (envFrom)
    creationPolicy: Owner
  # One JSON entry in the store with the secret variables of INSTALL.md §3, one key per variable:
  #   {"DATABASE_URL": "...", "GITHUB_CLIENT_SECRET": "...", "GITHUB_WEBHOOK_SECRET": "...",
  #    "TOKEN_ENCRYPTION_KEY": "..."}
  # The plain ones (PUBLIC_URL, GITHUB_CLIENT_ID, ...) can go in the pr-follower-config ConfigMap.
  dataFrom:
    - extract:
        key: /pr-follower/api
---
# The GitHub App private key, kept apart: it is multi-line, it is mounted as a file
# (GITHUB_APP_PRIVATE_KEY_FILE), and it rotates on its own schedule.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pr-follower-github-app
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: change-me } # your store
  target:
    name: pr-follower-github-app # mounted by api.yaml
    creationPolicy: Owner
  data:
    - secretKey: github-app.pem
      remoteRef:
        key: /pr-follower/github-app-pem # the .pem contents, as stored
