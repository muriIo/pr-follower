# The API: the only component that talks to Postgres and GitHub. Any number of replicas can run
# (ADR-0012); it needs outbound HTTPS to github.com, api.github.com and codeload.github.com.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-follower-api
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: pr-follower-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pr-follower-api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001 # makes the mounted private key readable
      terminationGracePeriodSeconds: 20 # it drains for up to 10 s on SIGTERM
      containers:
        - name: api
          image: ghcr.io/muriio/pr-follower-api
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - secretRef: { name: pr-follower } # every variable from INSTALL.md §3
          env:
            - { name: GITHUB_APP_PRIVATE_KEY_FILE, value: /run/secrets/github-app/github-app.pem }
          volumeMounts:
            - { name: github-app, mountPath: /run/secrets/github-app, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30 # migrations run before it listens
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi } # the Dependabot analysis reads repository tarballs in memory
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - name: github-app
          secret: { secretName: pr-follower-github-app, defaultMode: 0440 }
---
apiVersion: v1
kind: Service
metadata:
  name: pr-follower-api
spec:
  selector: { app.kubernetes.io/name: pr-follower-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
