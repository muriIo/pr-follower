@if (summary().has) {
  <section class="pf-batch" aria-live="polite">
    <div class="pf-batch-text">
      <h2 class="pf-batch-title">{{ summary().title }}</h2>
    </div>
    @if (batchAction().idle) {
      <div class="pf-actions">
        @if (summary().canApprove) {
          <button type="button" class="pf-btn pf-btn-primary" (click)="batchApprove.emit()">
            {{ summary().approveLabel }}
          </button>
        }
        <button
          type="button"
          [class]="'pf-btn ' + summary().mergeCls"
          [attr.aria-disabled]="summary().mergeDis"
          (click)="summary().mergeDis !== 'true' && batchMerge.emit()"
        >
          {{ summary().mergeLabel }}
        </button>
      </div>
    }
    @if (batchAction().running) {
      <div class="pf-batch-run">
        <div class="pf-progress">
          <span [style.width.%]="batchAction().pct"></span>
        </div>
        <span class="pf-running">
          <span class="pf-spin"></span>{{ batchAction().label }}
        </span>
        <button type="button" class="pf-btn" (click)="batchAction().cancel()">
          {{ 'radar.batch.cancel' | t }}
        </button>
      </div>
    }
  </section>
}

@if (batchAction().hasNote) {
  @if (batchAction().dismissible) {
    <p [class]="batchAction().noteCls + ' pf-note-dismissible'" role="alert">
      {{ batchAction().note }}
      <button type="button" class="pf-btn pf-btn-sm" (click)="batchAction().dismiss()">{{ 'notice.dismiss' | t }}</button>
    </p>
  } @else {
    <p [class]="batchAction().noteCls" role="status">{{ batchAction().note }}</p>
  }
}
