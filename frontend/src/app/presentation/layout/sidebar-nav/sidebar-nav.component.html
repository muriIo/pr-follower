<nav class="pf-side" [attr.aria-label]="'app.perspectives' | t">
  <div class="pf-brand-block">
    <div class="pf-brand">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="4" cy="3.5" r="1.75"></circle>
        <circle cx="4" cy="12.5" r="1.75"></circle>
        <circle cx="12" cy="12.5" r="1.75"></circle>
        <path d="M4 5.25v5.5M12 10.75V7a2.5 2.5 0 0 0-2.5-2.5H8"></path>
      </svg>
      <span>{{ 'app.brand' | t }}</span>
    </div>
    <div class="pf-live" role="status">
      <app-status-dot [dotClass]="connectionDotClass()" />
      <span>{{ connectionLabelKey() | t }}</span>
    </div>
  </div>

  <div class="pf-nav-group">
    <div class="pf-section">{{ 'app.perspectives' | t }}</div>

    <button
      type="button"
      class="pf-nav"
      [class.is-active]="store.view() === 'inbox'"
      [attr.aria-current]="store.view() === 'inbox' ? 'page' : 'false'"
      (click)="store.setPerspective('inbox')"
    >
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 9.5 4 3h8l2 6.5V13H2V9.5Z"></path>
        <path d="M2 9.5h3.5l1 1.5h3l1-1.5H14"></path>
      </svg>
      <span class="pf-nav-label">{{ 'nav.inbox' | t }}</span>
      @if (store.navCounts().inbox > 0) {
        <span class="pf-count pf-count-turn">{{ store.navCounts().inbox }}</span>
      }
    </button>

    <button
      type="button"
      class="pf-nav"
      [class.is-active]="store.view() === 'radar'"
      [attr.aria-current]="store.view() === 'radar' ? 'page' : 'false'"
      (click)="store.setPerspective('radar')"
    >
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="8" cy="8" r="6"></circle>
        <circle cx="8" cy="8" r="2.5"></circle>
        <path d="M8 8l4-4"></path>
      </svg>
      <span class="pf-nav-label">{{ 'nav.radar' | t }}</span>
      @if (store.navCounts().radar > 0) {
        <span class="pf-count">{{ store.navCounts().radar }}</span>
      }
    </button>

    <button
      type="button"
      class="pf-nav"
      [class.is-active]="store.view() === 'seats'"
      [attr.aria-current]="store.view() === 'seats' ? 'page' : 'false'"
      (click)="store.setPerspective('seats')"
    >
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2" width="5" height="5" rx="1"></rect>
        <rect x="9" y="2" width="5" height="5" rx="1"></rect>
        <rect x="2" y="9" width="5" height="5" rx="1"></rect>
        <rect x="9" y="9" width="5" height="5" rx="1"></rect>
      </svg>
      <span class="pf-nav-label">{{ 'nav.seats' | t }}</span>
      @if (store.navCounts().seats > 0) {
        <span class="pf-count">{{ store.navCounts().seats }}</span>
      }
    </button>

    <button
      type="button"
      class="pf-nav"
      [class.is-active]="store.view() === 'timeline'"
      [attr.aria-current]="store.view() === 'timeline' ? 'page' : 'false'"
      (click)="store.setPerspective('timeline')"
    >
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1.5 8h3l2-5 3 10 2-5h3"></path>
      </svg>
      <span class="pf-nav-label">{{ 'nav.timeline' | t }}</span>
      @if (store.navCounts().timeline > 0) {
        <span class="pf-count">{{ store.navCounts().timeline }}</span>
      }
    </button>
  </div>

  <div class="pf-side-foot">
    <div class="pf-user">
      @if (currentUser()?.avatarUrl) {
        <img class="pf-avatar" [src]="currentUser()?.avatarUrl" alt="" width="22" height="22" />
      } @else {
        <span class="pf-avatar" aria-hidden="true">{{ currentUser()?.avatarInitial }}</span>
      }
      <span>@{{ currentUser()?.login }}</span>
      <button
        type="button"
        id="pf-logout-btn"
        class="pf-logout-btn"
        [title]="'auth.logoutTitle' | t"
        (click)="authStore.logout()"
      >
        {{ 'auth.logout' | t }}
      </button>
    </div>
    <div class="pf-user-tags">
      @if (currentUser()?.primaryTeam) {
        <span class="pf-badge pf-tag">{{ currentUser()?.primaryTeam }}</span>
      }
      <button type="button" class="pf-badge pf-tag" (click)="toggleLocale()">
        {{ localeStore.locale() }}
      </button>
    </div>
  </div>
</nav>
