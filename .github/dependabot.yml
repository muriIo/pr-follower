# PR Follower triages Dependabot PRs, so it gets them too. Minor and patch updates are grouped per
# ecosystem to keep the queue short; majors arrive one by one. A new release is proposed only after
# a 7-day cooldown: a hijacked package is usually caught and pulled within days.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      go-minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm # pnpm-lock.yaml is read by the npm ecosystem
    directory: /frontend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      frontend-minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: github-actions # keeps the pinned SHAs and their version comments current
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
