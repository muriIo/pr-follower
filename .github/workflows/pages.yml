# Publishes the static landing page (landing/, ADR-0014) to GitHub Pages. It runs when a change to
# the page reaches `main`, so the page always describes released code, and can be run by hand.
# There is no build: the directory is uploaded as is. Actions are pinned to commit SHAs (the comment
# names the release); Dependabot keeps them current.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - landing/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false # never cut a deployment in half; the next one follows

jobs:
  deploy:
    name: deploy landing page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write # publish the site
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
