# The security scans of `make security` (docs/security.md): secrets in the whole history, known
# vulnerabilities in dependencies, code patterns, and these workflows. Weekly too, because a new
# advisory can make yesterday's dependencies vulnerable without any commit. No push trigger: changes
# land only through PRs, which this already scanned; the schedule scans the default branch.
name: Security

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: security (make security)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit: a secret removed later is still in the history
          persist-credentials: false
      - run: make security
