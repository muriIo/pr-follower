# A `vX.Y.Z` tag on main publishes both images to GHCR and creates the GitHub Release
# (docs/business-and-distribution.md §2). `vX.Y.Z-rc.N` does the same as a pre-release, for dry runs.
#
# verify   the tag names a commit on main, merged by a PR whose CI passed on its head. CI runs only
#          on PRs: main and develop take no direct pushes, and the required checks are strict
#          (up to date with the base), so the PR's run tested what landed
# build    each image for linux/amd64 and linux/arm64 on native runners, pushed by digest,
#          with an SBOM and max-mode provenance attached by BuildKit
# merge    one multi-arch index per image, tagged X.Y.Z, X.Y and sha-<commit>; signed with a
#          GitHub artifact attestation (gh attestation verify)
# release  the GitHub Release, its notes taken from the annotated tag written by /bump-version
#
# Publishing workflow: no dependency or build caches, actions pinned to commit SHAs, no
# credentials left in checkouts, and tag/SHA values reach scripts only through env.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/muriio # GHCR names are lowercase; the owner is muriIo

jobs:
  verify:
    name: verify (tag on main, PR CI green)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
    steps:
      - name: Tag format
        id: tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upgrade guide and version pins
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          # /bump-version prepares both before the tag; a release candidate is a dry run and needs neither.
          [[ "$PRERELEASE" == "true" ]] && { echo "pre-release: guide and pins not required"; exit 0; }
          fail=0
          if [[ ! -s "docs/upgrades/$TAG.md" ]]; then
            echo "::error::docs/upgrades/$TAG.md is missing: every release ships its upgrade guide (docs/upgrades/README.md)"
            fail=1
          fi
          pinned=$(sed -n 's/^PR_FOLLOWER_VERSION=//p' deploy/compose/.env.example)
          if [[ "$pinned" != "$VERSION" ]]; then
            echo "::error::deploy/compose/.env.example pins PR_FOLLOWER_VERSION=$pinned, not $VERSION"
            fail=1
          fi
          while read -r tag; do
            if [[ "$tag" != "$VERSION" ]]; then
              echo "::error::deploy/kubernetes/kustomization.yaml pins newTag $tag, not $VERSION"
              fail=1
            fi
          done < <(sed -n 's/^ *newTag: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' deploy/kubernetes/kustomization.yaml)
          exit "$fail"

      - name: Commit is on main
        run: |
          status=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)
          if [[ "$status" != "behind" && "$status" != "identical" ]]; then
            echo "::error::$TAG points at $SHA, which is not on main (compare: $status)"
            exit 1
          fi

      - name: Merged by a PR whose CI passed
        run: |
          # The commit a PR merge creates is never run by CI itself; its PR's head was.
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" | jq -r '
            [.[] | select(.merged_at != null and .merge_commit_sha == env.SHA)][0]
            // empty | "\(.number) \(.head.sha)"')
          if [[ -z "$pr" ]]; then
            echo "::error::$SHA is not the merge commit of a pull request"
            exit 1
          fi
          read -r number head <<< "$pr"
          gh api "repos/$REPO/commits/$head/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"
          for check in "backend (make backend-check)" "frontend (make frontend-check)"; do
            # The newest run of each required check counts (a re-run replaces a failed one).
            conclusion=$(jq -r --arg name "$check" \
              '[.check_runs[] | select(.name == $name)] | max_by(.id) | .conclusion // "missing"' \
              "$RUNNER_TEMP/checks.json")
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::#$number: '$check' is $conclusion on its head $head"
              exit 1
            fi
          done
          echo "$TAG: merged by #$number, CI green on $head"

  build:
    name: build (${{ matrix.image }}, ${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [api, panel]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: api
            context: backend
          - image: panel
            context: frontend
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/pr-follower-${{ matrix.image }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/pr-follower-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge and attest (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        image: [api, panel]
    env:
      IMAGE: ghcr.io/muriio/pr-follower-${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false # deploy by version, never latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Create the multi-arch index
        id: index
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for d in *; do args+=("$IMAGE@sha256:$d"); done # one file per platform digest
          docker buildx imagetools create "${args[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  release:
    name: github release
    needs: [verify, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Notes from the tag annotation
        run: |
          # The checkout of a tag push may not keep the annotation; fetch the tag object itself.
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # The images are public: read each multi-arch index digest back from the registry, so the
          # notes name exactly what was attested and operators can pin and verify by digest.
          digest() {
            docker buildx imagetools inspect "ghcr.io/muriio/pr-follower-$1:$VERSION" \
              --format '{{json .Manifest}}' | jq -r .digest
          }
          api=$(digest api)
          panel=$(digest panel)
          [[ "$api" == sha256:* && "$panel" == sha256:* ]] || { echo "::error::could not read the image digests"; exit 1; }
          {
            git for-each-ref "refs/tags/$TAG" --format='%(contents:body)'
            echo
            # The upgrade guide, with the digests it leaves for this step (a release candidate has none).
            if [[ -f "docs/upgrades/$TAG.md" ]]; then
              sed -e "s/sha256:API_DIGEST/$api/g" -e "s/sha256:PANEL_DIGEST/$panel/g" \
                -e 's/^# Upgrading to /## Upgrading to /' "docs/upgrades/$TAG.md"
              echo
            fi
            echo "## Images"
            echo
            echo "Multi-arch (linux/amd64, linux/arm64), with an SBOM and build provenance attached."
            echo "The image tag is the release name without the \`v\`. Deploy both at the same version, pinned by digest:"
            echo
            echo '```'
            echo "ghcr.io/muriio/pr-follower-api:$VERSION@$api"
            echo "ghcr.io/muriio/pr-follower-panel:$VERSION@$panel"
            echo '```'
            echo
            echo "Verify that each digest was built by this repository's release workflow from \`$TAG\` (\`gh\` must be signed in):"
            echo
            echo '```'
            for pair in "api@$api" "panel@$panel"; do
              echo "gh attestation verify oci://ghcr.io/muriio/pr-follower-${pair%%@*}@${pair#*@} \\"
              echo "  --repo muriIo/pr-follower --signer-workflow muriIo/pr-follower/.github/workflows/release.yml \\"
              echo "  --source-ref refs/tags/$TAG --deny-self-hosted-runners"
            done
            echo '```'
          } > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        run: |
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
