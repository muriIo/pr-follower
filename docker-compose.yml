# Postgres alone, for running the apps on the host (`make db-up`). The project name keeps its
# volume (`pr-follower-dev_postgres_data`) apart from the deploy bundle's (`deploy/compose`, project
# `pr-follower`): without it both took the folder name and shared one database.
name: pr-follower-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: pr-follower-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prfollower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prfollower_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pr_follower}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prfollower} -d ${POSTGRES_DB:-pr_follower}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
